
name: PURE HD AI - Phase 1 Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract and Locate Android Project
        shell: bash
        run: |
          set -e

          mkdir -p _source

          # Extract ZIP files if the project is uploaded as ZIP
          shopt -s nullglob
          for file in *.zip; do
            echo "Extracting: $file"
            unzip -q -o "$file" -d _source
          done

          # Find Gradle project root
          PROJECT_DIR=$(find . \
            -type f \
            -name gradlew \
            -not -path './.git/*' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Verify Project Files
        run: |
          test -f "$PROJECT_DIR/settings.gradle.kts" -o \
               -f "$PROJECT_DIR/settings.gradle"
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/gradlew"

      - name: Build PURE HD AI Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -name '*.apk' -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK successfully generated: $APK"
          ls -lh "$APK"

      - name: Upload PURE HD AI APK
        uses: actions/upload-artifact@v4
        with:
          name: PureHD-AI-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
