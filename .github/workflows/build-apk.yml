
name: PURE HD AI - Phase 1 Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android SDK 34
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p _source

          shopt -s nullglob
          ZIP_FILES=(*.zip)

          if [ ${#ZIP_FILES[@]} -eq 0 ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          for file in "${ZIP_FILES[@]}"; do
            unzip -oq "$file" -d _source
          done

          PROJECT_DIR=$(find _source \
            -type f -name gradlew | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

      - name: Verify Project
        run: |
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          test -d "$PROJECT_DIR/app"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -name "*.apk" -type f | head -n 1)

          test -n "$APK"
          echo "APK SUCCESS: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PureHD-AI-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
