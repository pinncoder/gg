
name: PURE HD AI - Phase 1 Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Extract Android Project
        shell: bash
        run: |
          set -e
          mkdir -p _source

          for file in *.zip; do
            [ -f "$file" ] || continue
            unzip -oq "$file" -d _source
          done

          PROJECT_DIR=$(find _source \
            -type f -name gradlew | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Verify Gradle Wrapper
        run: |
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          test -d "$PROJECT_DIR/app"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          echo "APK FOUND: $APK"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureHD-AI-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
